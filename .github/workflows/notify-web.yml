name: Notify web to rebuild

# When content is merged to main or dev, tell pyladies-seoul-web to rebuild the
# matching environment from that exact content revision.
on:
  push:
    branches: [main, dev]

# Required secret:
#   WEB_DISPATCH_TOKEN   Fine-grained PAT scoped only to
#                        PyLadiesKorea/pyladies-seoul-web with Contents: write for
#                        POST /repos/{owner}/{repo}/dispatches.
permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger pyladies-seoul-web deploy
        env:
          GH_TOKEN: ${{ secrets.WEB_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::WEB_DISPATCH_TOKEN is not configured"
            exit 1
          fi

          if [[ ! "${GITHUB_SHA:-}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::GITHUB_SHA must be a 40-character commit SHA"
            exit 1
          fi

          case "${GITHUB_REF_NAME:-}" in
            main)
              EVENT_TYPE="content-updated"
              ;;
            dev)
              EVENT_TYPE="content-dev-updated"
              ;;
            *)
              echo "::error::Unsupported content branch: ${GITHUB_REF_NAME:-<unset>}"
              exit 1
              ;;
          esac

          printf '%s\n' \
            "{\"event_type\":\"${EVENT_TYPE}\",\"client_payload\":{\"content_commit\":\"${GITHUB_SHA}\"}}" | \
            gh api \
              --method POST \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --input - \
              repos/PyLadiesKorea/pyladies-seoul-web/dispatches
